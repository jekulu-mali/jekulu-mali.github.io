<style>

cing:-.7px}.top-actions{display:flex;gap:10px;align-items:center}.select-wrap{border:1px solid var(--border);border-radius:11px;padding:10px 12px;background:#fff;max-width:260px}.select-wrap select{border:0;max-width:220px;outline:0;background:transparent;color:var(--ink);font-weight:600}.btn{border:1px solid var(--border);background:white;border-radius:10px;padding:11px 16px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}.btn:hover{filter:brightness(.96)}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.terracotta{background:var(--orange);border-color:var(--orange);color:#fff}.btn.small{padding:7px 11px;font-size:12px}.btn.danger{color:#a33d2c;border-color:#e6c6c0}.content{padding:31px 38px 70px;max-width:1520px;margin:auto}.hero{background:linear-gradient(105deg,#262724 0%,#39352e 65%,#6c422f 100%);color:white;border-radius:19px;min-height:205px;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;padding:30px 38px;gap:20px}.hero:after{content:'';position:absolute;right:-70px;top:-135px;width:390px;height:390px;border:45px double rgba(225,186,127,.15);border-radius:50%;pointer-events:none}.hero .eyebrow{color:#e1c395;letter-spacing:2.1px;font-size:11px;font-weight:800;text-transform:uppercase}.hero h2{font-family:Georgia,serif;font-size:34px;line-height:1.18;margin:13px 0 12px;font-weight:500}.hero p{color:#d9dfd7;margin:0;line-height:1.6}.hero .symbol{font-family:Georgia,serif;color:#e2bb7b;font-size:106px;opacity:.7;margin-right:60px;z-index:1}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:22px}.stat{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.stat .stat-title{color:var(--muted);font-size:12px;font-weight:650}.stat .stat-value{font-size:27px;font-weight:800;letter-spacing:-1px;margin:13px 0 7px;white-space:nowrap}.stat .stat-foot{color:#7d897d;font-size:11px}.stat .stat-foot.orange{color:#b76844}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:31px 0 15px}.section-head h2{font-size:19px;font-weight:750;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.panel{border:1px solid var(--border);border-radius:17px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}.two-cols{display:grid;grid-template-columns:1.35fr .85fr;gap:20px}.panel-pad{padding:22px}.panel-title{font-size:16px;font-weight:800;margin:0 0 17px}.progress-track{background:#e9e7df;border-radius:99px;height:9px;overflow:hidden}.progress-fill{background:var(--orange);height:100%;border-radius:99px}.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #f0eee8}.rowline:last-child{border-bottom:0}.avatar{width:38px;height:38px;border-radius:12px;background:#e9ded0;color:#895c3e;display:grid;place-items:center;font-weight:800;flex-shrink:0}.person{display:flex;align-items:center;gap:12px;min-width:0}.person b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{color:var(--muted);display:block;margin-top:4px}.pill{border-radius:100px;font-size:11px;font-weight:800;padding:6px 10px;background:#eef4ec;color:#397046;white-space:nowrap}.pill.warn{background:#fff1e6;color:#af6534}.pill.neutral{background:#eeede7;color:#72766f}.empty{padding:55px 22px;text-align:center;color:var(--muted)}.empty .emoji{font-size:35px;margin-bottom:12px}.empty h3{color:var(--ink);margin:0 0 8px}.empty p{line-height:1.6}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;min-width:610px}th{background:#f8f7f2;color:#8a8c83;text-transform:uppercase;letter-spacing:.6px;font-size:10px;font-weight:800;padding:15px 18px}td{border-top:1px solid #f0eee8;padding:15px 18px;font-size:13px}tr:hover td{background:#fdfaf5}.actions{display:flex;gap:7px;flex-wrap:wrap}.summary-box{border-radius:14px;background:#f8f4ec;padding:17px;margin-bottom:15px}.summary-box strong{display:block;font-size:27px;margin:8px 0}.muted{color:var(--muted)}.tiny{font-size:12px}.accent{color:var(--orange)}.field{display:flex;flex-direction:column;gap:7px}.field label{font-weight:700;font-size:12px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #dddcd4;background:#fff;border-radius:10px;color:var(--ink)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-note{font-size:12px;color:#837f75;line-height:1.6;margin:0}.modal-backdrop{position:fixed;inset:0;background:rgba(15,26,20,.65);z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fffefa;width:min(100%,520px);max-height:90vh;overflow:auto;border-radius:20px;padding:25px;box-shadow:0 25px 80px #10191044}.modal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:21px}.modal h2{font-family:Georgia,serif;font-size:25px;margin:0}.modal-close{border:0;background:#f3f0e9;width:34px;height:34px;border-radius:10px;font-size:22px}.modal form{display:grid;gap:16px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:7px}.notice{background:#fef6e9;border:1px solid #eedcbd;color:#855b32;padding:12px 15px;border-radius:12px;line-height:1.6;font-size:12px}.group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.group-card{padding:21px;border:1px solid var(--border);border-radius:16px;background:#fff;cursor:pointer;text-align:left}.group-card:hover{border-color:#c49b6b;box-shadow:var(--shadow)}.group-card h3{margin:8px 0;font-size:18px}.group-card .badge{font-size:10px;background:#e8efea;color:#436d4e;padding:5px 8px;border-radius:6px}.group-card p{color:var(--muted);line-height:1.7}.toast{position:fixed;right:20px;bottom:20px;background:#20372b;color:#fff;padding:14px 19px;border-radius:11px;box-shadow:0 8px 35px #0002;z-index:50;max-width:400px}.footnote{margin-top:28px;color:#99998f;font-size:11px;line-height:1.7}.mobile-brand{display:none}.separator{height:1px;background:var(--border);margin:17px 0}@media(max-width:1120px){.stats{grid-template-columns:repeat(2,1fr)}.two-cols{grid-template-columns:1fr}.topbar{padding:0 22px}.content{padding:23px}}@media(max-width:760px){.layout{display:block}.sidebar{position:fixed;z-index:10;bottom:0;top:auto;width:100%;height:68px;padding:5px;background:var(--green)}.sidebar .brand,.side-bottom{display:none}.nav{display:flex;justify-content:space-around;gap:0;height:100%}.nav button{display:flex;flex-direction:column;justify-content:center;gap:3px;font-size:9px;padding:5px 3px;width:20%;border-radius:8px}.nav .glyph{font-size:20px}.topbar{height:auto;min-height:88px;padding:13px 17px;align-items:start;flex-wrap:wrap}.top-left h1{font-size:23px}.top-actions{width:100%;justify-content:space-between}.select-wrap{flex:1;max-width:none}.select-wrap select{max-width:100%;width:100%}.content{padding:17px 15px 105px}.hero{padding:25px 23px;min-height:174px}.hero h2{font-size:26px}.hero .symbol{display:none}.stats{gap:10px;margin-top:13px}.stat{padding:15px}.stat .stat-value{font-size:21px}.stat .stat-title{font-size:11px}.group-grid,.fields{grid-template-columns:1fr}.section-head{align-items:flex-start}.section-head .btn{white-space:normal}.modal{padding:19px}.top-actions .btn{padding:11px 12px}.stat .stat-foot{font-size:10px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-icon">JK</div><div><div class="brand-name">JÈKULU</div><div class="brand-sub">TONTINES & SOLIDARITÉ</div></div></div><nav class="nav" id="nav"><button data-page="dashboard" class="active"><span class="glyph">▦</span>Vue d'ensemble</button><button data-page="groups"><span class="glyph">◈</span>Mes tontines</button><button data-page="payments"><span class="glyph">◉</span>Cotisations</button><button data-page="members"><span class="glyph">♙</span>Membres</button><button data-page="reports"><span class="glyph">▤</span>Rapports</button></nav><div class="side-bottom"><strong>JÈKULU · Version locale</strong><br>Gratuit • Aucun argent encaissé par l'application<br>Vos données restent sur cet appareil.</div></aside><main class="main"><header class="topbar"><div class="top-left"><div class="crumb">Espace de gestion / <span id="breadcrumb">Tableau de bord</span></div><h1 id="page-title">Tableau de bord</h1></div><div class="top-actions"><div class="select-wrap"><select id="group-select" aria-label="Tontine sélectionnée"></select></div><button class="btn primary" data-action="new-group">＋ Nouvelle tontine</button></div></header><div id="app" class="content"></div></main></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
'use strict';
const KEY='jekulu_local_v1';const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const today=()=>new Date().toISOString().slice(0,10);const money=n=>new Intl.NumberFormat('fr-FR').format(Math.round(Number(n)||0))+' FCFA';const dateFR=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR'):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demo=()=>{let names=['Aminata Traoré','Fatoumata Diallo','Mariam Coulibaly','Aïssata Koné','Oumar Diarra','Bintou Sidibé'];let members=names.map((name,i)=>({id:'m'+i,name,phone:''}));let payments=[];for(let r=1;r<=2;r++){for(let i=0;i<(r===1?6:3);i++)payments.push({id:uid(),memberId:members[i].id,round:r,amount:5000,date:today(),method:'Espèces'});}return {id:'demo',name:'Tontine du Marché · Démo',amount:5000,frequency:'Hebdomadaire',startDate:today(),currentRound:2,members,payments,payouts:[{round:1,memberId:members[0].id,date:today()}],demo:true};};
let state;try{state=JSON.parse(localStorage.getItem(KEY));}catch{}if(!state||!Array.isArray(state.groups))state={groups:[demo()],selected:'demo',page:'dashboard'};let currentPage=state.page||'dashboard';const persist=()=>{state.page=currentPage;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};const group=()=>state.groups.find(g=>g.id===state.selected)||state.groups[0];const paid=(g,m,round=g.currentRound)=>g.payments.filter(p=>p.memberId===m.id&&p.round===round).reduce((a,p)=>a+Number(p.amount),0);const roundTotal=(g,round=g.currentRound)=>g.payments.filter(p=>p.round===round).reduce((a,p)=>a+Number(p.amount),0);const beneficiary=(g,round=g.currentRound)=>g.members.length?g.members[(round-1)%g.members.length]:null;const initials=n=>String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();const toast=msg=>{document.getElementById('toast-root').innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>document.getElementById('toast-root').innerHTML='',3400);};
function updateTop(){let names={dashboard:'Tableau de bord',groups:'Mes tontines',payments:'Cotisations',members:'Membres',reports:'Rapports'};document.getElementById('page-title').textContent=names[currentPage];document.getElementById('breadcrumb').textContent=names[currentPage];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));document.getElementById('group-select').innerHTML=state.groups.length?state.groups.map(g=>'<option value="'+esc(g.id)+'" '+(g.id===group()?.id?'selected':'')+'>'+esc(g.name)+'</option>').join(''):'<option>Aucune tontine</option>';}
function empty(message,action='new-group',label='Créer une tontine'){return '<div class="panel empty"><div class="emoji">◈</div><h3>'+esc(message)+'</h3><p>Commencez en quelques instants avec JÈKULU.</p><button class="btn primary" data-action="'+action+'">'+esc(label)+'</button></div>';}
function stats(g){const total=g.members.length*g.amount,collect=roundTotal(g),missing=Math.max(0,total-collect),pct=total?Math.min(100,Math.round(100*collect/total)):0;return {total,collect,missing,pct};}
function stat(title,val,foot,orange=false){return '<div class="stat"><div class="stat-title">'+title+'</div><div class="stat-value">'+val+'</div><div class="stat-foot '+(orange?'orange':'')+'">'+foot+'</div></div>';}
function dashboard(g){if(!g)return empty('Bienvenue sur JÈKULU');const s=stats(g),b=beneficiary(g);return '<div class="hero"><div><div class="eyebrow">VOTRE ÉPARGNE COLLECTIVE</div><h2>Ensemble, nous allons plus loin.</h2><p>Suivez vos cotisations et vos tours en toute simplicité.<br>'+esc(g.name)+(g.demo?' · Exemple de démonstration':'')+'</p></div><div class="symbol">◉</div></div><div class="stats">'+stat('Membres actifs',g.members.length,'Dans cette tontine')+stat('Cagnotte prévue',money(s.total),'Pour ce tour')+stat('Montant collecté',money(s.collect),s.pct+' % des cotisations')+stat('Reste à collecter',money(s.missing),'Tour n° '+g.currentRound,true)+'</div><div class="two-cols"><div><div class="section-head"><div><h2>Suivi des cotisations</h2><p>Tour '+g.currentRound+' · '+esc(g.frequency)+'</p></div><button class="btn small" data-page="payments">Tout voir →</button></div><div class="panel panel-pad"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><strong>'+money(s.collect)+'</strong><span class="muted">'+s.pct+' %</span></div><div class="progress-track"><div class="progress-fill" style="width:'+s.pct+'%"></div></div><div style="margin-top:17px">'+(g.members.length?g.members.slice(0,5).map(m=>{let n=paid(g,m);return '<div class="rowline"><div class="person"><div class="avatar">'+esc(initials(m.name))+'</div><div><b>'+esc(m.name)+'</b><small>'+money(n)+' / '+money(g.amount)+'</small></div></div><span class="pill '+(n>=g.amount?'':'warn')+'">'+(n>=g.amount?'Payé':n?'Partiel':'En attente')+'</span></div>';}).join(''):'<p class="muted">Ajoutez des membres pour démarrer.</p>')+'</div><button class="btn primary" data-action="new-payment" style="margin-top:18px;width:100%">＋ Enregistrer une cotisation</button></div></div><div><div class="section-head"><div><h2>Prochain bénéficiaire</h2><p>Calendrier de redistribution</p></div></div><div class="panel panel-pad"><div class="summary-box"><span class="tiny muted">TOUR N° '+g.currentRound+'</span><strong>'+esc(b?.name||'Aucun membre')+'</strong><span class="tiny muted">Cagnotte prévue : '+money(s.total)+'</span></div><div class="rowline"><span class="muted">Cotisation individuelle</span><b>'+money(g.amount)+'</b></div><div class="rowline"><span class="muted">Fréquence</span><b>'+esc(g.frequency)+'</b></div><div class="rowline"><span class="muted">Statut de remise</span><span class="pill '+(g.payouts.some(p=>p.round===g.currentRound)?'':'warn')+'">'+(g.payouts.some(p=>p.round===g.currentRound)?'Confirmée':'À confirmer')+'</span></div><button class="btn terracotta" data-action="payout" style="width:100%;margin-top:18px">Confirmer la remise</button><button class="btn" data-action="next-round" style="width:100%;margin-top:8px">Passer au tour suivant →</button></div></div></div>'+footnote();}
function groupsPage(){return '<div class="section-head"><div><h2>Vos groupes de tontine</h2><p>Organisez chaque groupe selon ses propres règles.</p></div><button class="btn primary" data-action="new-group">＋ Créer un groupe</button></div>'+(state.groups.length?'<div class="group-grid">'+state.groups.map(g=>'<button class="group-card" data-action="select-group" data-id="'+esc(g.id)+'"><span class="badge">'+(g.demo?'EXEMPLE · ':'')+esc(g.frequency)+'</span><h3>'+esc(g.name)+'</h3><p>'+g.members.length+' membres · '+money(g.amount)+' / membre<br>Tour actuel : '+g.currentRound+'</p><span style="color:#a76340;font-weight:800">Gérer ce groupe →</span></button>').join('')+'</div>':empty('Aucun groupe pour le moment'))+footnote();}
function membersPage(g){if(!g)return empty('Créez votre première tontine');return '<div class="section-head"><div><h2>Les membres du groupe</h2><p>Ordre des bénéficiaires selon la liste ci-dessous.</p></div><button class="btn primary" data-action="new-member">＋ Ajouter un membre</button></div>'+(g.members.length?'<div class="panel table-scroll"><table><thead><tr><th>Ordre</th><th>Membre</th><th>Téléphone</th><th>Tour de réception</th><th>Actions</th></tr></thead><tbody>'+g.members.map((m,i)=>'<tr><td><b>#'+(i+1)+'</b></td><td><div class="person"><div class="avatar">'+esc(initials(m.name))+'</div><b>'+esc(m.name)+'</b></div></td><td>'+esc(m.phone||'—')+'</td><td>Tour '+(i+1)+'</td><td><div class="actions"><button class="btn small" data-action="move-up" data-id="'+esc(m.id)+'" '+(i===0?'disabled':'')+'>↑</button><button class="btn small" data-action="move-down" data-id="'+esc(m.id)+'" '+(i===g.members.length-1?'disabled':'')+'>↓</button><button class="btn small danger" data-action="delete-member" data-id="'+esc(m.id)+'">Retirer</button></div></td></tr>').join('')+'</tbody></table></div>':empty('Aucun membre dans cette tontine','new-member','Ajouter un membre'))+'<div class="notice" style="margin-top:17px">L’ordre de la liste détermine le bénéficiaire de chaque tour. Évitez de le modifier après le début des remises.</div>'+footnote();}
function paymentsPage(g){if(!g)return empty('Créez votre première tontine');let s=stats(g);return '<div class="section-head"><div><h2>Cotisations du tour '+g.currentRound+'</h2><p>'+esc(g.name)+' · Montant par membre : '+money(g.amount)+'</p></div><div class="actions"><button class="btn" data-action="prev-round">← Tour précédent</button><button class="btn primary" data-action="new-payment">＋ Cotisation</button></div></div><div class="stats" style="margin-top:0;margin-bottom:19px">'+stat('À collecter',money(s.total),'Montant prévu')+stat('Déjà collecté',money(s.collect),s.pct+' % encaissé')+stat('Reste',money(s.missing),'Non enregistré',true)+stat('Membres à jour',g.members.filter(m=>paid(g,m)>=g.amount).length+'/'+g.members.length,'Sur ce tour')+'</div>'+(g.members.length?'<div class="panel table-scroll"><table><thead><tr><th>Membre</th><th>Versé</th><th>Reste</th><th>Statut</th><th>Action</th></tr></thead><tbody>'+g.members.map(m=>{let p=paid(g,m),remain=Math.max(0,g.amount-p);return '<tr><td><b>'+esc(m.name)+'</b></td><td>'+money(p)+'</td><td>'+money(remain)+'</td><td><span class="pill '+(remain===0?'':'warn')+'">'+(remain===0?'À jour':p?'Partiel':'En attente')+'</span></td><td><div class="actions"><button class="btn small" data-action="new-payment" data-id="'+esc(m.id)+'" '+(remain===0?'disabled':'')+'>＋ Versement</button>'+(remain&&m.phone?'<button class="btn small" data-action="remind" data-id="'+esc(m.id)+'">WhatsApp</button>':'')+'</div></td></tr>';}).join('')+'</tbody></table></div>':empty('Ajoutez des membres','new-member','Ajouter un membre'))+'<div class="section-head"><div><h2>Derniers versements</h2><p>Historique du tour sélectionné</p></div></div>'+paymentHistory(g,g.currentRound)+footnote();}
function paymentHistory(g,round){let arr=g.payments.filter(p=>round===null||p.round===round).slice().reverse();return arr.length?'<div class="panel table-scroll"><table><thead><tr><th>Date</th><th>Membre</th><th>Tour</th><th>Montant</th><th>Moyen</th><th>Reçu</th></tr></thead><tbody>'+arr.map(p=>'<tr><td>'+dateFR(p.date)+'</td><td>'+esc(g.members.find(m=>m.id===p.memberId)?.name||'Membre retiré')+'</td><td>'+p.round+'</td><td><b>'+money(p.amount)+'</b></td><td>'+esc(p.method||'—')+'</td><td><button class="btn small" data-action="receipt" data-id="'+esc(p.id)+'">Imprimer</button></td></tr>').join('')+'</tbody></table></div>':'<div class="panel empty">Aucun versement enregistré pour ce tour.</div>';}
function reportsPage(g){if(!g)return empty('Créez votre première tontine');let all=g.payments.reduce((s,p)=>s+Number(p.amount),0),s=stats(g);return '<div class="section-head"><div><h2>Rapports et sauvegardes</h2><p>Retrouvez les opérations de votre tontine.</p></div></div><div class="stats" style="margin-top:0">'+stat('Total enregistré',money(all),'Tous les tours')+stat('Tour actuel',g.currentRound,'Sur '+g.members.length+' tours prévus')+stat('Collecte actuelle',money(s.collect),s.pct+' % du tour')+stat('Remises confirmées',g.payouts.length,'Au total')+'</div><div class="two-cols" style="margin-top:20px"><div class="panel panel-pad"><h3 class="panel-title">Exporter vos données</h3><p class="muted" style="line-height:1.7">Téléchargez une sauvegarde JSON pour retrouver vos tontines sur un autre appareil, ou un tableau CSV pour Excel.</p><div class="actions"><button class="btn primary" data-action="export-json">↓ Sauvegarde JSON</button><button class="btn" data-action="export-csv">↓ Export Excel (CSV)</button></div><div class="separator"></div><h3 class="panel-title">Importer une sauvegarde</h3><p class="muted tiny">L’importation remplace toutes les données présentes sur cet appareil.</p><input type="file" id="import-file" accept="application/json,.json" style="max-width:100%"></div><div class="panel panel-pad"><h3 class="panel-title">Gestion du groupe</h3><div class="rowline"><span class="muted">Début</span><b>'+dateFR(g.startDate)+'</b></div><div class="rowline"><span class="muted">Cotisation</span><b>'+money(g.amount)+'</b></div><div class="rowline"><span class="muted">Fréquence</span><b>'+esc(g.frequency)+'</b></div><div class="actions" style="margin-top:20px"><button class="btn" data-action="edit-group">Modifier</button><button class="btn danger" data-action="delete-group">Supprimer le groupe</button></div></div></div><div class="section-head"><div><h2>Historique complet</h2><p>Tous les versements enregistrés</p></div></div>'+paymentHistory(g,null)+footnote();}
function footnote(){return '<p class="footnote">JÈKULU est une première version locale gratuite : les données restent dans ce navigateur. Sauvegardez régulièrement en JSON. L’application ne collecte ni ne transfère d’argent. Aucun compte cloud ni synchronisation multi-appareils dans cette version.</p>';}
function render(){if(!state.groups.some(g=>g.id===state.selected))state.selected=state.groups[0]?.id||null;updateTop();const g=group();document.getElementById('app').innerHTML=({dashboard:()=>dashboard(g),groups:groupsPage,payments:()=>paymentsPage(g),members:()=>membersPage(g),reports:()=>reportsPage(g)})[currentPage]();persist();}
function modal(title,body){document.getElementById('modal-root').innerHTML='<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modal-head"><h2>'+esc(title)+'</h2><button class="modal-close" data-action="close-modal" aria-label="Fermer">×</button></div>'+body+'</div></div>';}
const closeModal=()=>document.getElementById('modal-root').innerHTML='';
function groupModal(edit=false){let g=group();modal(edit?'Modifier la tontine':'Créer une tontine','<form id="group-form"><div class="field"><label>Nom de la tontine</label><input name="name" placeholder="Ex. Les femmes de Badalabougou" maxlength="80" required value="'+(edit?esc(g.name):'')+'"></div><div class="fields"><div class="field"><label>Cotisation par membre (FCFA)</label><input name="amount" type="number" min="1" step="1" required value="'+(edit?g.amount:5000)+'"></div><div class="field"><label>Fréquence</label><select name="frequency">'+['Quotidienne','Hebdomadaire','Bimensuelle','Mensuelle'].map(f=>'<option '+(edit&&g.frequency===f?'selected':'')+'>'+f+'</option>').join('')+'</select></div></div><div class="field"><label>Date de début</label><input name="startDate" type="date" required value="'+(edit?esc(g.startDate):today())+'"></div><p class="form-note">Les cotisations sont enregistrées manuellement. JÈKULU ne reçoit aucun fonds.</p><div class="modal-foot"><button class="btn" type="button" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">'+(edit?'Enregistrer':'Créer la tontine')+'</button></div></form>');document.getElementById('group-form').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),name=String(d.get('name')).trim(),amount=Number(d.get('amount'));if(!name||!Number.isSafeInteger(amount)||amount<=0)return toast('Vérifiez les informations.');if(edit){Object.assign(g,{name,amount,frequency:d.get('frequency'),startDate:d.get('startDate')});}else{let id=uid();state.groups.push({id,name,amount,frequency:d.get('frequency'),startDate:d.get('startDate'),currentRound:1,members:[],payments:[],payouts:[],demo:false});state.selected=id;currentPage='members';}closeModal();render();toast(edit?'Tontine modifiée.':'Tontine créée ! Ajoutez vos membres.');};}
function memberModal(){let g=group();if(!g)return groupModal();modal('Ajouter un membre','<form id="member-form"><div class="field"><label>Nom et prénom</label><input name="name" maxlength="90" placeholder="Ex. Awa Traoré" required></div><div class="field"><label>Numéro WhatsApp (facultatif)</label><input name="phone" type="tel" maxlength="24" placeholder="Ex. 223 70 00 00 00"></div><p class="form-note">Le membre sera ajouté en fin d’ordre de passage. N’enregistrez ses coordonnées qu’avec son accord.</p><div class="modal-foot"><button class="btn" type="button" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Ajouter le membre</button></div></form>');document.getElementById('member-form').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),name=String(d.get('name')).trim();if(!name)return;g.members.push({id:uid(),name,phone:String(d.get('phone')).trim()});closeModal();render();toast('Membre ajouté.');};}
function paymentModal(memberId=''){let g=group();if(!g||!g.members.length){toast('Ajoutez d’abord un membre.');return;}let candidates=g.members.filter(m=>paid(g,m)<g.amount);if(!candidates.length){toast('Tous les membres sont à jour pour ce tour.');return;}if(!candidates.some(m=>m.id===memberId))memberId=candidates[0].id;modal('Enregistrer une cotisation','<form id="payment-form"><div class="notice">Tour n° '+g.currentRound+' · '+esc(g.name)+'</div><div class="field"><label>Membre</label><select name="memberId" id="payment-member">'+candidates.map(m=>'<option value="'+esc(m.id)+'" '+(m.id===memberId?'selected':'')+'>'+esc(m.name)+' — reste '+money(g.amount-paid(g,m))+'</option>').join('')+'</select></div><div class="fields"><div class="field"><label>Montant (FCFA)</label><input name="amount" id="payment-amount" type="number" min="1" step="1" required value="'+(g.amount-paid(g,g.members.find(m=>m.id===memberId)))+'"></div><div class="field"><label>Moyen de paiement</label><select name="method"><option>Espèces</option><option>Mobile Money</option><option>Virement</option><option>Autre</option></select></div></div><div class="field"><label>Date du versement</label><input name="date" type="date" value="'+today()+'" required></div><p class="form-note">Confirmez uniquement un paiement réellement reçu par le responsable de la tontine.</p><div class="modal-foot"><button class="btn" type="button" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>');document.getElementById('payment-member').onchange=e=>{let m=g.members.find(m=>m.id===e.target.value);document.getElementById('payment-amount').value=Math.max(0,g.amount-paid(g,m));};document.getElementById('payment-form').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),m=g.members.find(m=>m.id===d.get('memberId')),amount=Number(d.get('amount'));if(!m||!Number.isSafeInteger(amount)||amount<1||amount>g.amount-paid(g,m))return toast('Montant supérieur au reste à payer ou invalide.');g.payments.push({id:uid(),memberId:m.id,round:g.currentRound,amount,date:d.get('date'),method:d.get('method')});closeModal();render();toast('Versement enregistré.');};}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(g){let rows=[['Groupe','Tour','Membre','Date','Montant FCFA','Moyen'],...g.payments.map(p=>[g.name,p.round,g.members.find(m=>m.id===p.memberId)?.name||'Membre retiré',p.date,p.amount,p.method])];let csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download('jekulu-cotisations.csv',csv,'text/csv;charset=utf-8');}
function printReceipt(g,p){let m=g.members.find(x=>x.id===p.memberId),w=window.open('','_blank','width=720,height=760');if(!w){toast('Autorisez les fenêtres pop-up pour imprimer le reçu.');return;}w.document.write('<!doctype html><html lang="fr"><meta charset="utf-8"><title>Reçu JÈKULU</title><style>body{font-family:Arial,sans-serif;padding:45px;color:#26342b}h1{font-family:Georgia,serif;color:#b96840;letter-spacing:4px}.receipt{border:2px solid #b96840;padding:30px;max-width:580px;margin:auto}dl{display:grid;grid-template-columns:1fr 1fr;gap:18px}dt{color:#888;font-size:12px}dd{margin:6px 0;font-weight:bold}small{color:#777}</style><div class="receipt"><h1>JÈKULU</h1><h2>Reçu de cotisation</h2><hr><dl><div><dt>Tontine</dt><dd>'+esc(g.name)+'</dd></div><div><dt>Membre</dt><dd>'+esc(m?.name||'Membre retiré')+'</dd></div><div><dt>Tour</dt><dd>'+p.round+'</dd></div><div><dt>Date</dt><dd>'+dateFR(p.date)+'</dd></div><div><dt>Moyen</dt><dd>'+esc(p.method)+'</dd></div><div><dt>Montant reçu</dt><dd>'+money(p.amount)+'</dd></div></dl><hr><p><small>Référence : '+esc(p.id)+'</small></p><p><small>Reçu généré à partir des informations saisies par le gestionnaire. Ne constitue pas une preuve bancaire.</small></p></div></html>');w.document.close();w.focus();setTimeout(()=>w.print(),300);}
function remind(g,m){let due=Math.max(0,g.amount-paid(g,m)),phone=m.phone.replace(/[^\d]/g,'');if(phone.length===8)phone='223'+phone;if(!phone)return toast('Numéro manquant.');let msg='Bonjour '+m.name+', rappel de votre cotisation pour '+g.name+' (tour '+g.currentRound+'). Montant restant : '+money(due)+'. Merci ! — JÈKULU';window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank','noopener');}
function handleAction(action,id){let g=group();switch(action){case'new-group':groupModal();break;case'edit-group':groupModal(true);break;case'new-member':memberModal();break;case'new-payment':paymentModal(id);break;case'close-modal':closeModal();break;case'select-group':state.selected=id;currentPage='dashboard';render();break;case'move-up':case'move-down':{let i=g.members.findIndex(m=>m.id===id),j=i+(action==='move-up'?-1:1);if(i<0||j<0||j>=g.members.length)return;[g.members[i],g.members[j]]=[g.members[j],g.members[i]];render();break;}case'delete-member':{let m=g.members.find(m=>m.id===id);if(!m)return;if(g.payments.some(p=>p.memberId===id)||g.payouts.some(p=>p.memberId===id))return toast('Impossible de retirer un membre avec des opérations enregistrées.');if(confirm('Retirer '+m.name+' du groupe ?')){g.members=g.members.filter(m=>m.id!==id);render();}break;}case'payout':{if(!g.members.length)return toast('Ajoutez des membres.');if(g.payouts.some(p=>p.round===g.currentRound))return toast('Remise déjà confirmée.');let b=beneficiary(g),s=stats(g);if(!confirm('Confirmer que '+b.name+' a reçu '+money(s.collect)+' pour le tour '+g.currentRound+' ?'+(s.missing?'\nAttention : '+money(s.missing)+' restent à collecter.':'')))return;g.payouts.push({round:g.currentRound,memberId:b.id,date:today(),amount:s.collect});render();toast('Remise confirmée.');break;}case'next-round':{if(!g.members.length)return toast('Ajoutez des membres.');if(g.currentRound>=g.members.length)return toast('Cycle terminé. Créez une nouvelle tontine pour un nouveau cycle.');if(!g.payouts.some(p=>p.round===g.currentRound)&&!confirm('La remise de ce tour n’est pas confirmée. Passer au tour suivant ?'))return;g.currentRound++;render();toast('Tour '+g.currentRound+' ouvert.');break;}case'prev-round':{if(g.currentRound>1){g.currentRound--;render();}break;}case'remind':{let m=g.members.find(m=>m.id===id);if(m)remind(g,m);break;}case'receipt':{let p=g.payments.find(p=>p.id===id);if(p)printReceipt(g,p);break;}case'export-json':download('jekulu-sauvegarde-'+today()+'.json',JSON.stringify({groups:state.groups,selected:state.selected},null,2),'application/json');toast('Sauvegarde téléchargée.');break;case'export-csv':exportCSV(g);toast('CSV téléchargé.');break;case'delete-group':if(confirm('Supprimer définitivement '+g.name+' et toutes ses opérations ?')){state.groups=state.groups.filter(x=>x.id!==g.id);state.selected=state.groups[0]?.id||null;currentPage='groups';render();toast('Tontine supprimée.');}break;}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action],[data-page]');if(!b)return;if(b.dataset.page){currentPage=b.dataset.page;render();return;}handleAction(b.dataset.action,b.dataset.id||'');});document.getElementById('group-select').addEventListener('change',e=>{state.selected=e.target.value;render();});document.addEventListener('change',async e=>{if(e.target.id!=='import-file'||!e.target.files[0])return;try{let obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.groups)||!obj.groups.every(g=>g.id&&Array.isArray(g.members)&&Array.isArray(g.payments)&&Array.isArray(g.payouts)))throw Error('Format invalide');if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;state.groups=obj.groups;state.selected=obj.selected;currentPage='dashboard';render();toast('Sauvegarde importée.');}catch(err){toast('Import impossible : fichier JSON invalide.');}});document.addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal();});render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
