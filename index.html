.listrow:last-child{border-bottom:0}.muted{color:var(--soft)}.pill{display:inline-block;border-radius:30px;background:#eee8dc;padding:4px 9px;font-size:11px;font-weight:700}.note{background:#fff4e7;border-left:3px solid var(--terra);padding:12px;border-radius:8px;color:#7d4b34;font-size:13px;margin:14px 0}.auth{max-width:440px;margin:8vh auto}.auth .card{padding:26px}.tabs{display:flex;gap:7px;margin:16px 0}.tabs button{flex:1}.hidden{display:none!important}.status{padding:12px;border-radius:10px;background:#f4e8dc;margin:12px 0}.status.ok{background:#e9f4e9}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu{display:flex;gap:8px;overflow:auto;padding-bottom:12px;margin:10px 0 16px}.menu button{white-space:nowrap;background:#eae4d8;color:#333}.menu button.active{background:#292a26;color:white}.spacer{height:12px}.right{text-align:right}a{color:inherit}.code{font-family:ui-monospace,monospace;letter-spacing:1px;word-break:break-all;background:#f4efe6;padding:8px;border-radius:8px}.footer{font-size:12px;color:var(--soft);margin-top:25px}.busy{opacity:.6;pointer-events:none}@media(max-width:680px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.header{align-items:flex-start}.hero{padding:20px}.metric b{font-size:21px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script type="module">

const API='https://mvtanedghcvgumtvxxqa.supabase.co';
const KEY='sb_publishable_yMaMU_VpJpq_-nu_llotSw_CUtVQ5ib';
const db=createClient(API,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){if(!user){render();return}groups=check(await db.from('jekulu_tontines').select('*').order('created_at',{ascending:false}));if(!groups.some(g=>g.id===selected))selected=groups[0]?.id||null;members=[];profiles={};contrib=[];payouts=[];if(selected){members=check(await db.from('jekulu_members').select('*').eq('tontine_id',selected).order('joined_at'));const ids=members.map(m=>m.user_id);if(ids.length){const ps=check(await db.from('jekulu_profiles').select('id,full_name').in('id',ids));profiles=Object.fromEntries(ps.map(p=>[p.id,p.full_name]))}contrib=check(await db.from('jekulu_contributions').select('*').eq('tontine_id',selected).order('paid_at',{ascending:false}));payouts=check(await db.from('jekulu_payouts').select('*').eq('tontine_id',selected).order('paid_at',{ascending:false}))}render()}

const memberName=id=>{const m=members.find(m=>m.id===id);return m?(profiles[m.user_id]||'Membre '+m.user_id.slice(0,7)):'Membre'};
function render(){if(!user){app.innerHTML=`<main class="auth"><div class="logo">JÈKULU</div><p class="muted">Ensemble, épargnons. Ensemble, avançons.</p><div class="card"><h1>Bienvenue</h1><p class="muted">Votre espace sécurisé de gestion collaborative des tontines.</p><div class="tabs"><button id="login-tab">Connexion</button><button class="secondary" id="signup-tab">Inscription</button></div><form id="auth-form"><div id="name-field" class="hidden"><label>Nom complet</label><input id="full_name" autocomplete="name" minlength="2"></div><label>Adresse e-mail</label><input id="email" type="email" autocomplete="email" required><label>Mot de passe</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><div class="spacer"></div><button style="width:100%" id="auth-submit">Se connecter</button></form><p><button class="outline" id="reset-password" style="width:100%">Mot de passe oublié ?</button></p>${notice?`<div class="status">${esc(notice)}</div>`:''}</div><p class="footer">100 % gratuit • Aucun argent n'est encaissé par JÈKULU</p></main>`;bindAuth();return}
const t=g();const total=contrib.filter(x=>x.round_number===t?.current_round).reduce((a,x)=>a+Number(x.amount),0);const target=Number(t?.contribution_amount||0)*members.length;const me=members.find(x=>x.user_id===user.id);
app.innerHTML=`<main class="layout"><header class="header"><div><div class="logo">JÈKULU</div><div class="sub">Gestion collective des tontines • Version collaborative</div></div><button id="logout" class="secondary">Déconnexion</button></header><div class="hero"><div class="sub">VOTRE ÉPARGNE COLLECTIVE</div><h1>Ensemble, nous allons plus loin.</h1><p>Gérez les cotisations et les bénéficiaires de votre groupe en toute transparence.</p></div>${notice?`<div class="status">${esc(notice)}</div>`:''}<div class="card"><div class="row"><div><h3>Mes tontines</h3><div class="sub">Connecté : ${esc(user.email)}</div></div><div class="stack"><button id="new-group">+ Créer</button><button class="secondary" id="join-group">Rejoindre</button></div></div>${groups.length?`<label>Choisir une tontine</label><select id="group-select">${groups.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:'<p class="muted">Aucune tontine. Créez un groupe ou rejoignez-en un avec un code.</p>'}</div>${t?`<div class="grid"><div class="card metric"><small>Membres</small><b>${members.length}</b><small>Dans la tontine</small></div><div class="card metric"><small>Objectif du tour</small><b>${money(target)}</b><small>Tour n° ${t.current_round}</small></div><div class="card metric"><small>Collecté au tour</small><b>${money(total)}</b><small>Reste : ${money(Math.max(0,target-total))}</small></div></div><div class="menu">${[['dashboard','Vue d’ensemble'],['members','Membres'],['payments','Cotisations'],['payouts','Remises'],['settings','Gestion']].map(([k,l])=>`<button data-view="${k}" class="${view===k?'active':''}">${l}</button>`).join('')}</div><section id="view-content">${viewContent(t,me,total,target)}</section>`:''}<p class="footer">JÈKULU ne reçoit ni ne transfère de fonds. Les opérations sont déclaratives et doivent être vérifiées par les responsables du groupe.</p></main>`;bindMain()}
function viewContent(t,me,total,target){if(view==='dashboard')return `<div class="card"><h2>${esc(t.name)}</h2><p class="muted">${esc(t.description||'Tontine collaborative')}</p><div class="row"><span class="pill">${esc(me?.role||'membre')}</span><span class="pill">Cotisation : ${money(t.contribution_amount)}</span></div><div class="spacer"></div><p><b>Tour ${t.current_round}</b> — ${money(total)} collectés sur ${money(target)} attendus</p></div><div class="card"><h3>Dernières cotisations</h3>${contrib.length?contrib.slice(0,5).map(p=>`<div class="listrow"><div><b>${esc(memberName(p.member_id))}</b><div class="sub">${date(p.paid_at)} • Tour ${p.round_number}</div></div><b>${money(p.amount)}</b></div>`).join(''):'<p class="muted">Aucune cotisation enregistrée.</p>'}</div>`;
if(view==='members')return `<div class="card"><div class="row"><h2>Membres (${members.length})</h2><span class="pill">Invitations par code</span></div>${members.map(m=>`<div class="listrow"><div><b>${esc(profiles[m.user_id]||'Compte '+m.user_id.slice(0,7))}</b><div class="sub">Depuis le ${date(m.joined_at)}</div></div><span class="pill">${esc(m.role)}</span></div>`).join('')||'<p>Aucun membre</p>'}</div>`;
if(view==='payments')return `<div class="card"><div class="row"><h2>Cotisations</h2>${manager()?'<button id="add-payment">+ Enregistrer</button>':''}</div><p class="muted">Les cotisations enregistrées ne peuvent pas être supprimées depuis l’application.</p>${contrib.map(p=>`<div class="listrow"><div><b>${esc(memberName(p.member_id))}</b><div class="sub">${date(p.paid_at)} • Tour ${p.round_number}${p.note?' • '+esc(p.note):''}</div></div><b>${money(p.amount)}</b></div>`).join('')||'<p class="muted">Aucune cotisation.</p>'}</div>`;
if(view==='payouts')return `<div class="card"><div class="row"><h2>Remises aux bénéficiaires</h2>${manager()?'<button id="add-payout">+ Confirmer une remise</button>':''}</div>${payouts.map(p=>`<div class="listrow"><div><b>${esc(memberName(p.member_id))}</b><div class="sub">${date(p.paid_at)} • Tour ${p.round_number}</div></div><b>${money(p.amount)}</b></div>`).join('')||'<p class="muted">Aucune remise enregistrée.</p>'}</div>`;
return `<div class="card"><h2>Gestion de la tontine</h2><p><b>Votre rôle :</b> ${esc(me?.role||'membre')}</p>${owner()?`<button id="invite-code">Afficher le code d'invitation</button><div class="spacer"></div><button class="secondary" id="next-round">Passer au tour suivant</button>`:'<p class="muted">Le propriétaire peut consulter le code d’invitation et ouvrir le tour suivant.</p>'}<p class="note">Pour les premiers essais, créez des comptes de test. Ne saisissez pas de vraies opérations financières avant validation complète.</p></div>`}
function bindAuth(){let mode='login';const setMode=x=>{mode=x;$('name-field').classList.toggle('hidden',x==='login');$('auth-submit').textContent=x==='login'?'Se connecter':"Créer mon compte";$('password').autocomplete=x==='login'?'current-password':'new-password';$('login-tab').className=x==='login'?'':'secondary';$('signup-tab').className=x==='signup'?'':'secondary'};$('login-tab').onclick=()=>setMode('login');$('signup-tab').onclick=()=>setMode('signup');$('auth-form').onsubmit=e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value,full_name=$('full_name').value.trim();task(async()=>{if(mode==='signup'){if(full_name.length<2)throw Error('Indiquez votre nom complet.');const r=await db.auth.signUp({email,password,options:{data:{full_name},emailRedirectTo:location.origin+location.pathname}});check(r);if(r.data.session){user=r.data.user;check(await db.from('jekulu_profiles').upsert({id:user.id,full_name}))}else{notice='Compte créé. Vérifiez votre e-mail pour confirmer votre inscription, puis connectez-vous.';render();return}}else{const r=await db.auth.signInWithPassword({email,password});check(r);user=r.data.user;await ensureProfile()}})};$('reset-password').onclick=()=>{const email=$('email').value.trim();if(!email)return alertMsg('Saisissez d’abord votre e-mail.');task(async()=>{check(await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}));notice='Si ce compte existe, un e-mail de réinitialisation a été envoyé.';render()})}}
async function ensureProfile(){if(!user)return;const r=await db.from('jekulu_profiles').select('id').eq('id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){const name=(user.user_metadata?.full_name||user.email?.split('@')[0]||'Utilisateur').slice(0,120);check(await db.from('jekulu_profiles').insert({id:user.id,full_name:name.length>=2?name:'Utilisateur'}))}}
function memberOptions(){return members.map(m=>`<option value="${esc(m.id)}">${esc(memberName(m.id))}</option>`).join('')}
function promptForm(title,html,submit){const el=document.createElement('div');el.style.cssText='position:fixed;inset:0;background:#151512a8;display:grid;place-items:center;z-index:30;padding:15px;overflow:auto';el.innerHTML=`<div class="card" style="width:min(450px,100%);max-height:92vh;overflow:auto"><div class="row"><h2>${esc(title)}</h2><button class="secondary" type="button" id="close-dialog">✕</button></div><form id="dialog-form">${html}<div class="spacer"></div><button type="submit" style="width:100%">Valider</button></form></div>`;document.body.append(el);el.querySelector('#close-dialog').onclick=()=>el.remove();el.onclick=e=>{if(e.target===el)el.remove()};el.querySelector('#dialog-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);el.remove();task(()=>submit(Object.fromEntries(fd)))}}
function bindMain(){$('logout').onclick=()=>task(async()=>{check(await db.auth.signOut());user=null;groups=[];selected=null});$('new-group').onclick=()=>promptForm('Nouvelle tontine','<label>Nom de la tontine</label><input name="name" required minlength="2" maxlength="120"><label>Montant de cotisation (FCFA)</label><input name="amount" type="number" min="1" step="1" required><label>Description (facultatif)</label><textarea name="description" rows="2"></textarea>',async f=>{check(await db.from('jekulu_tontines').insert({name:f.name.trim(),contribution_amount:Number(f.amount),description:f.description.trim()}).select('id').single())});$('join-group').onclick=()=>promptForm('Rejoindre une tontine','<label>Code d’invitation reçu de l’administrateur</label><input name="code" required autocomplete="off">',async f=>{check(await db.rpc('jekulu_join',{p_code:f.code.trim()}))});const sel=$('group-select');if(sel)sel.onchange=()=>{selected=sel.value;view='dashboard';task(async()=>{})};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});if(!g())return;
const pay=$('add-payment');if(pay)pay.onclick=()=>promptForm('Enregistrer une cotisation',`<label>Membre</label><select name="member_id" required>${memberOptions()}</select><label>Tour</label><input name="round" type="number" min="1" value="${g().current_round}" required><label>Montant (FCFA)</label><input name="amount" type="number" min="1" step="1" value="${Number(g().contribution_amount)}" required><label>Note (facultatif)</label><input name="note" maxlength="200">`,async f=>{check(await db.from('jekulu_contributions').insert({tontine_id:selected,member_id:f.member_id,round_number:Number(f.round),amount:Number(f.amount),note:f.note.trim()||null}))});
const out=$('add-payout');if(out)out.onclick=()=>promptForm('Confirmer une remise',`<p class="note">Confirmez uniquement une remise réellement effectuée. Une seule remise par tour.</p><label>Bénéficiaire</label><select name="member_id" required>${memberOptions()}</select><label>Tour</label><input name="round" type="number" min="1" value="${g().current_round}" required><label>Montant remis (FCFA)</label><input name="amount" type="number" min="1" step="1" required><label>Note</label><input name="note" maxlength="200">`,async f=>{check(await db.from('jekulu_payouts').insert({tontine_id:selected,member_id:f.member_id,round_number:Number(f.round),amount:Number(f.amount),note:f.note.trim()||null}))});
const inv=$('invite-code');if(inv)inv.onclick=()=>task(async()=>{const code=check(await db.rpc('jekulu_invite_code',{p_tontine:selected}));notice='Code à communiquer uniquement aux membres invités : '+code;render()});const next=$('next-round');if(next)next.onclick=()=>{if(!confirm('Ouvrir le tour suivant ? Vérifiez les cotisations et la remise du tour actuel.'))return;task(async()=>{check(await db.from('jekulu_tontines').update({current_round:g().current_round+1}).eq('id',selected))})}}
(async()=>{const r=await db.auth.getUser();user=r.data?.user||null;if(user){try{await ensureProfile();await load()}catch(e){alertMsg(e.message)}}else render()})();db.auth.onAuthStateChange((event,session)=>{const newUser=session?.user||null;if(event==='PASSWORD_RECOVERY'){setTimeout(()=>promptForm('Définir un nouveau mot de passe','<label>Nouveau mot de passe (au moins 8 caractères)</label><input name="password" type="password" minlength="8" required>',async f=>{check(await db.auth.updateUser({password:f.password}));notice='Mot de passe modifié.'}),0)}if(newUser?.id!==user?.id){user=newUser;if(user){setTimeout(()=>{ensureProfile().then(load).catch(e=>alertMsg(e.message))},0)}else{groups=[];selected=null;render()}}});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
// JÈKULU — calendrier prévisionnel des bénéficiaires (lecture seule)
const jekuluRenderOriginal = render;
render = function () {
  jekuluRenderOriginal();
  if (!user || !g()) return;
  const menu = document.querySelector('.menu');
  if (!menu) return;
  const btn = document.createElement('button');
  btn.textContent = 'Calendrier';
  btn.className = view === 'calendar' ? 'active' : '';
  btn.onclick = () => { view = 'calendar'; render(); };
  menu.appendChild(btn);
  if (view !== 'calendar') return;
  const t = g();
  const list = [...members].sort((a, b) =>
    new Date(a.joined_at) - new Date(b.joined_at));
  const rows = list.map((m, i) => {
    const tour = i + 1;
    const done = payouts.some(p => Number(p.round_number) === tour);
    const status = done ? 'Remise enregistrée' :
      tour === Number(t.current_round) ? 'Tour actuel' :
      tour < Number(t.current_round) ? 'Tour passé — à vérifier' : 'À venir';
    return `<div class="listrow"><div><b>Tour ${tour} — ${esc(memberName(m.id))}</b><div class="sub">Date à définir</div></div><span class="pill">${status}</span></div>`;
  }).join('');
  document.getElementById('view-content').innerHTML =
    `<div class="card"><h2>Calendrier des bénéficiaires</h2>` +
    `<p class="muted">Ordre prévisionnel selon l'ancienneté d'adhésion. ` +
    `Les dates et la fréquence ne sont pas encore configurées. ` +
    `Ne considérez pas cet ordre comme validé sans accord du groupe.</p>` +
    (rows || '<p>Aucun membre.</p>') + `</div>`;
};
  // JÈKULU — fréquence et date de démarrage des tontines
const jekuluBindMainBase = bindMain;
bindMain = function () {
  jekuluBindMainBase();
  const create = document.getElementById('new-group');
  if (create) create.onclick = () => promptForm('Nouvelle tontine',
    '<label>Nom de la tontine</label><input name="name" required minlength="2" maxlength="120">' +
    '<label>Montant de cotisation (FCFA)</label><input name="amount" type="number" min="1" step="1" required>' +
    '<label>Fréquence</label><select name="frequency" required><option value="daily">Journalière</option><option value="weekly">Hebdomadaire</option><option value="monthly" selected>Mensuelle</option></select>' +
    '<label>Date de démarrage</label><input name="start_date" type="date" required>' +
    '<label>Description (facultatif)</label><textarea name="description" rows="2"></textarea>',
    async f => { check(await db.from('jekulu_tontines').insert({
      name:f.name.trim(), contribution_amount:Number(f.amount),
      description:f.description.trim(), frequency:f.frequency,
      start_date:f.start_date
    }).select('id').single()); });
  const next = document.getElementById('next-round');
  if (next && g()) {
    const t = g();
    const b = document.createElement('button');
    b.className = 'secondary';
    b.textContent = 'Configurer le calendrier';
    b.style.marginRight = '8px';
    b.onclick = () => promptForm('Configurer le calendrier',
      '<label>Fréquence</label><select name="frequency" required>' +
      ['daily','weekly','monthly'].map((v,i) =>
        `<option value="${v}" ${t.frequency===v?'selected':''}>${['Journalière','Hebdomadaire','Mensuelle'][i]}</option>`).join('') +
      '</select><label>Date de démarrage</label>' +
      `<input name="start_date" type="date" value="${t.start_date||''}" required>`,
      async f => { check(await db.from('jekulu_tontines').update({
        frequency:f.frequency, start_date:f.start_date
      }).eq('id',t.id)); });
    next.before(b);
  }
};

// Afficher les dates prévues dans le calendrier existant
const jekuluRenderWithCalendar = render;
render = function () {
  jekuluRenderWithCalendar();
  const t = g();
  if (view !== 'calendar' || !t || !t.start_date) return;
  const [year,month,day] = t.start_date.split('-').map(Number);
  const dates = document.querySelectorAll('#view-content .listrow .sub');
  dates.forEach((el,i) => {
    const d = new Date(Date.UTC(year,month-1,day));
    if (t.frequency === 'daily') d.setUTCDate(d.getUTCDate()+i);
    else if (t.frequency === 'weekly') d.setUTCDate(d.getUTCDate()+7*i);
    else {
      const m = month-1+i;
      const last = new Date(Date.UTC(year,m+1,0)).getUTCDate();
      d.setUTCFullYear(year,m,Math.min(day,last));
    }
    el.textContent = 'Date prévue : ' + d.toLocaleDateString('fr-FR',
      {day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'});
  });
};
// JÈKULU — ordre des bénéficiaires, enregistré dans Supabase
const jekuluRenderAvantOrdre = render;
let jekuluOrdreBrouillon = null;
let jekuluOrdreTontine = null;
render = function () {
  jekuluRenderAvantOrdre();
  const t = g();
  if (!user || !t || view !== 'calendar') return;
  const zone = document.getElementById('view-content');
  if (!zone) return;
  if (jekuluOrdreTontine !== t.id) {
    jekuluOrdreTontine = t.id;
    jekuluOrdreBrouillon = null;
  }
  const membresTries = [...members].sort((a,b) =>
    new Date(a.joined_at) - new Date(b.joined_at));
  const ids = membresTries.map(m => m.id);
  const enregistres = Array.isArray(t.rotation_order) ? t.rotation_order : [];
  const ordreValide = [...new Set(enregistres.filter(id => ids.includes(id)))];
  const ordreInitial = [...ordreValide, ...ids.filter(id => !ordreValide.includes(id))];
  const modification = Array.isArray(jekuluOrdreBrouillon);
  const ordre = modification ? jekuluOrdreBrouillon.filter(id => ids.includes(id)) : ordreInitial;
  ids.forEach(id => { if (!ordre.includes(id)) ordre.push(id); });
  const datePrevue = i => {
    if (!t.start_date) return 'Date à définir';
    const [y,m,j] = t.start_date.split('-').map(Number);
    const d = new Date(Date.UTC(y,m-1,j));
    if (t.frequency === 'daily') d.setUTCDate(d.getUTCDate()+i);
    else if (t.frequency === 'weekly') d.setUTCDate(d.getUTCDate()+7*i);
    else {
      const mois = m-1+i;
      const dernier = new Date(Date.UTC(y,mois+1,0)).getUTCDate();
      d.setUTCFullYear(y,mois,Math.min(j,dernier));
    }
    return 'Date prévue : ' + d.toLocaleDateString('fr-FR',
      {day:'2-digit',month:'long',year:'numeric',timeZone:'UTC'});
  };
  const lignes = ordre.map((id,i) => {
    const m = members.find(x => x.id === id);
    if (!m) return '';
    const tour = i+1;
    const versement = payouts.find(p => Number(p.round_number) === tour);
    const statut = versement ?
      (versement.member_id === id ? 'Remise enregistrée' : 'Remise à vérifier') :
      tour === Number(t.current_round) ? 'Tour actuel' :
      tour < Number(t.current_round) ? 'Tour passé — à vérifier' : 'À venir';
    const commandes = modification ?
      `<div class="stack"><button type="button" class="secondary" data-monte="${i}" ${i===0?'disabled':''}>↑</button>`+
      `<button type="button" class="secondary" data-descend="${i}" ${i===ordre.length-1?'disabled':''}>↓</button></div>` : '';
    return `<div class="listrow"><div><b>Tour ${tour} — ${esc(memberName(id))}</b>`+
      `<div class="sub">${esc(datePrevue(i))}</div></div><span class="pill">${esc(statut)}</span>${commandes}</div>`;
  }).join('');
  const actions = owner() ?
    (modification ? '<div class="stack"><button id="jekulu-save-order">Enregistrer l’ordre</button><button class="secondary" id="jekulu-cancel-order">Annuler</button></div>' :
    '<button id="jekulu-edit-order">Modifier l’ordre des bénéficiaires</button>') : '';
  zone.innerHTML = `<div class="card"><h2>Calendrier des bénéficiaires</h2>`+
    `<p class="muted">Ordre ${ordreValide.length?'enregistré':'provisoire (ancienneté d’adhésion)'}. `+
    `Les dates sont prévisionnelles et les remises doivent être confirmées séparément.</p>`+
    `${lignes || '<p>Aucun membre.</p>'}<div class="spacer"></div>${actions}</div>`;
  const modifier = document.getElementById('jekulu-edit-order');
  if (modifier) modifier.onclick = () => { jekuluOrdreBrouillon = [...ordreInitial]; render(); };
  const annuler = document.getElementById('jekulu-cancel-order');
  if (annuler) annuler.onclick = () => { jekuluOrdreBrouillon = null; render(); };
  zone.querySelectorAll('[data-monte]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.monte);
    if (i < 1) return;
    [jekuluOrdreBrouillon[i-1],jekuluOrdreBrouillon[i]] =
      [jekuluOrdreBrouillon[i],jekuluOrdreBrouillon[i-1]];
    render();
  });
  zone.querySelectorAll('[data-descend]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.descend);
    if (i >= jekuluOrdreBrouillon.length-1) return;
    [jekuluOrdreBrouillon[i],jekuluOrdreBrouillon[i+1]] =
      [jekuluOrdreBrouillon[i+1],jekuluOrdreBrouillon[i]];
    render();
  });
  const sauver = document.getElementById('jekulu-save-order');
  if (sauver) sauver.onclick = () => {
    if (!confirm('Valider cet ordre des bénéficiaires pour tous les membres ?')) return;
    const valeur = [...jekuluOrdreBrouillon];
    task(async () => {
      check(await db.from('jekulu_tontines').update({rotation_order:valeur}).eq('id',t.id));
      jekuluOrdreBrouillon = null;
      notice = 'Ordre des bénéficiaires enregistré.';
    });
  };
};
// JÈKULU — préparation du tour suivant avec contrôle de l'administrateur

const jekuluBindMainAvantRotation = bindMain;
bindMain = function () {
  jekuluBindMainAvantRotation();
  const suivant = document.getElementById('next-round');
  const t = g();
  if (!suivant || !t || !owner()) return;

  const membresParDate = [...members].sort((a,b) =>
    new Date(a.joined_at) - new Date(b.joined_at));
  const idsExistants = membresParDate.map(m => m.id);
  const enregistres = Array.isArray(t.rotation_order) ? t.rotation_order : [];
  const ordre = [...new Set(enregistres.filter(id => idsExistants.includes(id)))];
  idsExistants.forEach(id => { if (!ordre.includes(id)) ordre.push(id); });

  const tour = Number(t.current_round);
  const actuelId = ordre[tour - 1];
  const prochainId = ordre[tour];
  const collecte = contrib.filter(p => Number(p.round_number) === tour)
    .reduce((total,p) => total + Number(p.amount), 0);
  const objectif = Number(t.contribution_amount) * members.length;
  const remisesTour = payouts.filter(p => Number(p.round_number) === tour);
  const remiseCorrecte = !!actuelId && remisesTour.length === 1 &&
    remisesTour[0].member_id === actuelId;

  const information = document.createElement('div');
  information.className = 'note';
  information.style.marginBottom = '12px';
  information.innerHTML = '<b>Rotation des bénéficiaires</b>' +
    '<p>Tour actuel : ' + tour + ' — ' + (actuelId ? esc(memberName(actuelId)) : 'non défini') + '</p>' +
    '<p>Prochain bénéficiaire : <b>' + (prochainId ? esc(memberName(prochainId)) : 'Fin du cycle') + '</b></p>' +
    '<p>Cotisations du tour : ' + money(collecte) + ' / ' + money(objectif) + '</p>' +
    '<p>Remise au bénéficiaire actuel : ' +
    (remiseCorrecte ? 'enregistrée' : 'non confirmée ou à vérifier') + '</p>' +
    '<p>Le passage au tour suivant reste soumis à votre validation.</p>';
  suivant.before(information);
  suivant.textContent = 'Valider et ouvrir le tour suivant';
  suivant.disabled = !prochainId;
  suivant.onclick = () => {
    if (!prochainId) return alertMsg('Le cycle est terminé.');
    if (collecte < objectif) return alertMsg('Impossible : cotisations du tour incomplètes.');
    if (!remiseCorrecte) return alertMsg('Impossible : confirmez d’abord la remise au bénéficiaire prévu pour ce tour.');
    if (!confirm('Confirmer la clôture du tour ' + tour +
      ' et ouvrir le tour ' + (tour + 1) + ' pour ' + memberName(prochainId) + ' ?')) return;
    task(async () => {
      const r = await db.from('jekulu_tontines')
        .update({current_round:tour + 1})
        .eq('id',t.id).eq('current_round',tour).select('id');
      check(r);
      if (!r.data || r.data.length !== 1)
        throw Error('Le tour a déjà changé. Actualisez JÈKULU.');
    });
  };
};

// JÈKULU — suivi individuel des cotisations
let jekuluSuiviFiltre = 'tous';
const jekuluRenderAvantSuivi = render;

render = function () {
  jekuluRenderAvantSuivi();
  if (!user || !g()) return;

  const menu = document.querySelector('.menu');
  if (!menu) return;

  const bouton = document.createElement('button');
  bouton.textContent = 'Suivi des cotisations';
  bouton.className = view === 'suivi' ? 'active' : '';
  bouton.onclick = () => {
    view = 'suivi';
    render();
  };
  menu.appendChild(bouton);

  if (view !== 'suivi') return;

  const t = g();
  const tour = Number(t.current_round);
  const montant = Number(t.contribution_amount);
  const versements = contrib.filter(
    p => Number(p.round_number) === tour
  );

  const bilan = members.map(m => {
    const paye = versements
      .filter(p => p.member_id === m.id)
      .reduce((s, p) => s + Number(p.amount), 0);
    const reste = Math.max(0, montant - paye);
    const statut = paye > montant ? 'Excédent à vérifier' :
      paye >= montant ? 'Complet' :
      paye > 0 ? 'Partiel' : 'Non versé';
    return {nom:memberName(m.id), paye, reste, statut};
  });

  const complet = bilan.filter(
    x => x.statut === 'Complet'
  ).length;
  const recu = bilan.reduce((s,x) => s + x.paye, 0);
  const objectif = montant * bilan.length;
  const visible = jekuluSuiviFiltre === 'manquants'
    ? bilan.filter(x =>
        x.reste > 0 || x.statut === 'Excédent à vérifier')
    : bilan;

  const lignes = visible.map(x =>
    `<div class="listrow"><div><b>${esc(x.nom)}</b>` +
    `<div class="sub">Versé : ${money(x.paye)} · ` +
    `Reste : ${money(x.reste)}</div></div>` +
    `<span class="pill">${esc(x.statut)}</span></div>`
  ).join('');

  const zone = document.getElementById('view-content');
  if (!zone) return;

  zone.innerHTML =
    `<div class="card"><h2>Suivi des cotisations</h2>` +
    `<p class="muted">Tour n° ${tour} · ` +
    `Cotisation par membre : ${money(montant)}</p>` +
    `<p><b>${complet} / ${bilan.length}</b> ` +
    `membres ont payé exactement leur cotisation.</p>` +
    `<p><b>Collecté :</b> ${money(recu)} / ${money(objectif)}</p>` +
    `<div class="stack">` +
    `<button id="suivi-tous">Tous</button>` +
    `<button id="suivi-manquants" class="secondary">` +
    `À vérifier / compléter</button>` +
    `<button id="suivi-refresh" class="secondary">` +
    `Actualiser</button></div>` +
    `<div class="spacer"></div>` +
    (lignes || '<p>Aucun membre dans cette catégorie.</p>') +
    `<p class="muted">Données déclaratives, non vérifiées ` +
    `auprès d'une banque ou d'un opérateur mobile.</p></div>`;

  document.getElementById('suivi-tous').onclick = () => {
    jekuluSuiviFiltre = 'tous';
    render();
  };
  document.getElementById('suivi-manquants').onclick = () => {
    jekuluSuiviFiltre = 'manquants';
    render();
  };
  document.getElementById('suivi-refresh').onclick =
    () => task(async () => {});
};

// JÈKULU — rappels WhatsApp manuels
const jekuluRenderAvantRappels = render;

render = function () {
  jekuluRenderAvantRappels();
  if (!user || !g() || view !== 'suivi' || !manager()) return;

  const carte = document.querySelector('#view-content .card');
  if (!carte) return;

  const t = g();
  const tour = Number(t.current_round);
  const montant = Number(t.contribution_amount);

  const lignes = members.map(m => {
    const verse = contrib.filter(p =>
      p.member_id === m.id &&
      Number(p.round_number) === tour
    ).reduce((total, p) => total + Number(p.amount), 0);

    return {
      nom: memberName(m.id),
      reste: Math.max(0, montant - verse)
    };
  }).filter(x => x.reste > 0);

  const bloc = document.createElement('div');
  bloc.className = 'card';

  bloc.innerHTML =
    '<h3>Rappels WhatsApp</h3>' +
    '<p class="muted">Vérifiez les paiements avant ' +
    'de contacter un membre. Aucun envoi automatique.</p>' +
    (lignes.length ? lignes.map(x => {
      const message =
        'Bonjour ' + x.nom +
        ', rappel amical pour la tontine ' + t.name +
        ' (tour ' + tour + '). Il reste ' +
        money(x.reste) +
        ' à régler selon le suivi JÈKULU. ' +
        'Si vous avez déjà payé, merci de le signaler ' +
        'au responsable.';

      const lien = 'https://wa.me/?text=' +
        encodeURIComponent(message);

      return '<div class="listrow"><div><b>' +
        esc(x.nom) + '</b>' +
        '<div class="sub">Reste : ' +
        money(x.reste) + '</div></div>' +
        '<a target="_blank" rel="noopener noreferrer" href="' +
        lien + '">Ouvrir WhatsApp</a></div>';
    }).join('') :
    '<p>Toutes les cotisations sont complètes pour ce tour.</p>');

  carte.after(bloc);
};

</script></body></html>
